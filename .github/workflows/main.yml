name: Build SOMED APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -q SOMED_VTC_pret_pour_APK.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        working-directory: app
        run: npm install

      - name: Compiler l'app web
        working-directory: app
        run: npm run build

      - name: Créer le projet Android
        working-directory: app
        run: npx cap add android

      - name: Icônes Android
        working-directory: app
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Permissions Android
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_NETWORK_STATE POST_NOTIFICATIONS VIBRATE; do
            grep -q "android.permission.$P" $MANIFEST || \
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $MANIFEST
          done

      - name: Synchroniser Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: somed-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
